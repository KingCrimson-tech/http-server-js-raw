services:
  server:
    build: .
    image: raw-http-server:latest
    ports:
      - "3000:3000"   # data plane
      - "9090:9090"   # admin /metrics (Prometheus format)
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 9090
      WORKERS: ${WORKERS:-0}   # 0 = auto (all available CPUs)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  baseline:
    build: .
    image: raw-http-server:latest
    profiles: ["bench"]
    command: ["node", "bench/baseline-http.js"]
    ports:
      - "3001:3001"
    environment:
      HOST: 0.0.0.0
      PORT: 3001
